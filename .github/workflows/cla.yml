name: cla

# Contributor License Agreement gate for the open-core repo.
# An external contributor signs ONCE by commenting the phrase below on their PR;
# the signature is recorded in the `cla-signatures` branch of this repo. Until
# signed, the CLA status check stays red and blocks the merge button.
#
# pull_request_target (not pull_request) is required so the check has base-repo
# context + write access for PRs opened from forks. This workflow never checks
# out or runs PR code, so that trigger is safe here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If GITHUB_TOKEN proves flaky at re-triggering the check after signing,
          # add a fine-grained PAT (contents:write on this repo) as CLA_TOKEN and
          # uncomment the next line:
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/Synthefy/synthefy-nori/blob/main/CLA.md'
          branch: 'cla-signatures'
          # Comma-separated GitHub usernames that are exempt from signing the CLA.
          # Internal Synthefy contributors are covered by Synthefy's employment/IP
          # agreements, so they don't need to sign the individual CLA — only
          # external contributors do. Keep this in sync with the internal team
          # (mirrors .github/CODEOWNERS).
          #
          # Humans only — bots are intentionally NOT allowlisted. A bot cannot
          # sign (the flow requires the PR author to comment the agreement), so a
          # bot-authored PR will sit with a red CLA check. If that ever needs to
          # merge, add the specific bot login here (e.g. copilot-swe-agent[bot]).
          allowlist: 'sagarwal-atg,d31003,yogabbagabb,raimishah,adityanarayanan03,PohanLi-Synthefy,minkyu-choi07,ajanbekzat'
