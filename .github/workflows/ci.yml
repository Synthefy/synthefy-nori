name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --extra dev
      - run: uv run python -c "import synthefy_nori"
      - run: uv run pytest tests
      - run: uv run ruff check src scripts tests
      - run: uv build

  # Merge gate (part 1): a real inference forward pass on CPU. Downloads the
  # public Synthefy/Nori checkpoint. Mark this job as a required status check in
  # branch protection so it blocks the merge button (see branch-protection.md).
  inference:
    name: CI test inference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --extra dev
      - run: uv run pytest -m slow tests/test_inference_e2e.py tests/test_memory_policy_e2e.py

  # Merge gate (part 2): one real training step from scratch on CPU (data-gen ->
  # loss -> optimizer step -> checkpoint write). Offline; no checkpoint download.
  train-step:
    name: CI test train step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --extra dev
      - run: uv run pytest -m slow tests/test_training_smoke.py

  # Merge gate (part 3): the embedding feature end-to-end — NoriEmbedding, the
  # get_embeddings API, the clustering-quality checks, and the shipped examples
  # (run on tiny data). Downloads the public checkpoint. These are `slow`, so the
  # default `test` job deselects them; this job is what actually exercises the
  # real embedding path (and the examples) on every PR. Needs the `eval` extra
  # for the TabArena example's dataset registry.
  embedding:
    name: CI test embeddings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --extra dev --extra eval
      - run: uv run pytest -m slow tests/embedding/

  # torch/CUDA-range guard: the published range is `torch>=2.8,<2.14`, so verify
  # the package imports and inference works at every supported minor release.
  # Deliberately does NOT use uv.lock — it pins each torch from the CPU wheel
  # index (GitHub runners have no GPU), then installs the rest from PyPI.
  # `--no-config` bypasses the repo-only `torch<2.9` lock constraint; the venv
  # binaries are invoked directly to avoid `uv run` re-syncing to the lock.
  # 2.9.x is the cu130 floor; 2.12.x is the cu132 floor.
  compat:
    name: torch compat (${{ matrix.torch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.8.0", "2.9.1", "2.10.0", "2.11.0", "2.12.0", "2.13.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv venv --python 3.11
      - run: uv pip install --no-config "torch==${{ matrix.torch }}" --torch-backend cpu
      - run: uv pip install --no-config -e ".[dev]"
      - run: .venv/bin/python -c "import torch, synthefy_nori; print(torch.__version__)"
      - run: .venv/bin/pytest tests
      - name: Run slow inference compatibility tests with transient-download retries
        shell: bash
        run: |
          set -uo pipefail

          nori_max_attempts=3
          nori_backoff_seconds=30
          nori_attempt=1
          nori_transient_pattern='429 Too Many Requests|HTTP Error 429|HTTP Error 5[0-9]{2}'
          nori_transient_pattern+='|ReadTimeout|ConnectTimeout|ConnectionError|RemoteDisconnected'

          while (( nori_attempt <= nori_max_attempts )); do
            nori_log="$(mktemp)"
            .venv/bin/pytest -m slow tests/test_inference_e2e.py 2>&1 | tee "$nori_log"
            nori_status="${PIPESTATUS[0]}"

            if (( nori_status == 0 )); then
              rm -f "$nori_log"
              exit 0
            fi

            # Retry only failures that look like a transient checkpoint download.
            # Assertion failures and other deterministic regressions fail immediately.
            if ! grep -Eq "$nori_transient_pattern" "$nori_log"; then
              echo "Compatibility test failure was not transient; refusing to retry." >&2
              rm -f "$nori_log"
              exit "$nori_status"
            fi

            rm -f "$nori_log"
            if (( nori_attempt == nori_max_attempts )); then
              echo "Transient compatibility failure persisted for $nori_max_attempts attempts." >&2
              exit "$nori_status"
            fi

            nori_jitter_seconds=$((RANDOM % 16))
            nori_wait_seconds=$((nori_backoff_seconds + nori_jitter_seconds))
            echo "::warning::Transient checkpoint download failure on attempt $nori_attempt/$nori_max_attempts; retrying in ${nori_wait_seconds}s."
            sleep "$nori_wait_seconds"
            nori_backoff_seconds=$((nori_backoff_seconds * 2))
            nori_attempt=$((nori_attempt + 1))
          done
