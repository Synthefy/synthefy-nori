name: private-release

# Private distribution: pushing a vX.Y.Z tag builds the sdist + wheel and
# attaches them to a PRIVATE GitHub Release. Independent of publish.yml (PyPI).
# See docs/private-distribution.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a private release for, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write # required to create the GitHub Release

jobs:
  private-release:
    name: Build + attach to private Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Verify built version matches tag
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          wheel=$(basename dist/synthefy_tabular-*.whl)
          pkg_version=$(echo "$wheel" | awk -F- '{print $2}')
          echo "tag=$tag pkg_version=$pkg_version wheel=$wheel"
          if [ "$tag" != "$pkg_version" ]; then
            echo "Tag $tag does not match package version $pkg_version" >&2
            exit 1
          fi

      - name: Create / update private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$ref" >/dev/null 2>&1; then
            gh release upload "$ref" dist/* --clobber
          else
            gh release create "$ref" dist/* \
              --title "$ref" \
              --notes "Private build of synthefy-tabular $ref. Install: see docs/private-distribution.md" \
              --verify-tag
          fi
