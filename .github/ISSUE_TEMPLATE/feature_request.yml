name: Feature request
description: Suggest an improvement or new capability for Nori
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Nori. Describe the user problem first so proposed solutions can be evaluated in context.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what blocks you today?
      placeholder: Describe the workflow, users, and outcome—not only the requested API.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like Nori to provide.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you tried?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, references, benchmarks, or related issues.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to contribute this feature?
      options:
        - Yes, I can open a pull request.
        - Maybe, with guidance from a maintainer.
        - No, I am only proposing the idea.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
        - label: This request is about the open-source Nori project in this repository.
          required: true
