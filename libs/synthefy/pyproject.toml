[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthefy"
version = "6.3.0"
description = "Python client for the Synthefy API: time-series forecasting and Nori in-context tabular regression"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [
    {name = "Synthefy", email = "contact@synthefy.com"}
]
maintainers = [
    {name = "Synthefy", email = "contact@synthefy.com"}
]
keywords = ["forecasting", "api", "machine-learning", "time-series", "tabular", "regression", "nori"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0,<0.28.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# Optional local inference for SynthefyNoriClient(mode="local"/"auto").
# synthefy-nori >=0.13.1 makes recoverable SVD fallbacks visible to local-mode callers and
# supports Python >=3.9, matching this package's floor, so no environment marker is needed.
local = ["synthefy-nori>=0.13.1"]
# Client-side text embedding for predict(text_columns=...): reuses synthefy-nori's
# MultimodalPreprocessor + sentence-transformers to widen text into numeric SVD
# features before the request. Needs the version that ships text_features.
text = ["synthefy-nori[text]>=0.12.0"]
# Signed Amazon SageMaker endpoint invocation. boto3 resolves credentials from
# its standard chain; the public client deliberately accepts no raw AWS keys.
aws = ["boto3>=1.34.0,<2.0.0"]

[project.urls]
Homepage = "https://synthefy.com"

[tool.hatch.build.targets.wheel]
packages = ["src/synthefy"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "/src",
    "/docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
exclude = [
    "INTERNAL_README.md",
]

[dependency-groups]
dev = [
    "boto3>=1.34.0,<2.0.0",
    "build>=1.3.0",
    "twine>=6.1.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.25.0",
]
