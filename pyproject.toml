[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthefy-nori"
version = "0.12.0"
description = "Nori foundation model training, inference, and evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{ name = "Synthefy" }]
keywords = [
    "tabular",
    "foundation-model",
    "machine-learning",
    "deep-learning",
    "regression",
    "pytorch",
    "synthetic-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "einops>=0.7",
    "huggingface-hub>=1.0",
    "kditransform>=1.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "torch>=2.8",
    "tqdm>=4.65",
    "typing-extensions>=4.10",
]

[project.urls]
Homepage = "https://github.com/Synthefy/synthefy-nori"
Repository = "https://github.com/Synthefy/synthefy-nori"
Issues = "https://github.com/Synthefy/synthefy-nori/issues"
Changelog = "https://github.com/Synthefy/synthefy-nori/releases"

[project.optional-dependencies]
train = ["wandb>=0.15.0", "xgboost"]
eval = ["matplotlib", "openml"]
interpretability = ["shapiq>=1.0", "matplotlib"]
# Zero-shot text features: embed free-text columns and append them as numeric
# columns (NoriRegressor(text_columns=...)). sentence-transformers is imported
# lazily, so numeric-only use never needs it.
text = ["sentence-transformers"]
dev = ["build", "pytest", "ruff"]

[project.scripts]
synthefy-nori-train = "synthefy_nori.training.cli:main"
synthefy-nori-eval = "synthefy_nori.evaluation.cli:main"
synthefy-nori-download = "synthefy_nori.hf:download_cli"
synthefy-nori-upload = "synthefy_nori.hf:upload_cli"

# Resolve/lock only for CUDA-capable platforms; macOS/CPU are not supported here.
[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

# Install torch from PyTorch's CUDA 12.8 wheel index so `uv sync` reproduces the
# GPU build the benchmarks were run on, without a manual install step. This is
# only the repo's *default* dev/lock build — it is not a hard requirement.
# Note: this only affects uv workflows; `pip install synthefy-nori` is unaffected
# and resolves any `torch>=2.8`. Consumers wanting a different build override the
# index in their own project. CUDA 13.x needs torch>=2.9 (cu130) or >=2.12
# (cu132), which in turn need Python>=3.10 (torch dropped 3.9 in 2.9).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"synthefy_nori.configs" = ["*.json"]
"synthefy_nori.evaluation.benchmark_lists" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: opt-in end-to-end tests — download checkpoints + run real inference, or run a real training step (run with `pytest -m slow`)",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]
